owner: Ronvik4
repo: mauzo-status

# Checked every 5 minutes from GitHub Actions. When one goes down, Upptime
# opens an issue in this repo (GitHub emails the assignee) and closes it
# when the site recovers.
assignees:
  - Ronvik4

sites:
  - name: Website
    url: https://kadetech.online
  - name: POS app
    url: https://kadetech.online/pos
  - name: API
    url: https://kadetech.online/api/v1/health
  - name: Sign-in page
    url: https://kadetech.online/login

status-website:
  baseUrl: /mauzo-status
  logoUrl: https://kadetech.online/images/email/mauzo-plus-avatar.png
  name: Mauzo Plus Status
  introTitle: "**Mauzo Plus** service status"
  introMessage: Live availability and response times of the Mauzo Plus website, POS app and API, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: Mauzo Plus
      href: https://kadetech.online
